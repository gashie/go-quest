{{define "dashboard.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - GoQuest</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/animations.css">
</head>
<body>
    {{template "nav" .}}

    <main class="dashboard">
        <h1>Dashboard</h1>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value" id="dash-level">1</div>
                <div class="stat-label">Level</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="dash-xp">0</div>
                <div class="stat-label">Total XP</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="dash-completed">0/64</div>
                <div class="stat-label">Lessons</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="dash-badges">0</div>
                <div class="stat-label">Badges</div>
            </div>
        </div>

        <h2>Badges</h2>
        <div class="badge-gallery" id="badge-gallery"></div>

        <h2>Phase Progress</h2>
        <div class="phase-progress-list" id="phase-progress-list">
            {{range .Phases}}
            <div class="phase-progress-row" data-phase="{{.Slug}}">
                <span class="phase-row-name">{{.Name}}</span>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <span class="progress-pct">0%</span>
            </div>
            {{end}}
        </div>
    </main>

    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
{{end}}
