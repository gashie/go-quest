{{define "challenge-mode.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Mode}} - GoQuest</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="/static/css/game-hud.css">
    <link rel="stylesheet" href="/static/css/inventory.css">
    <link rel="stylesheet" href="/static/css/mini-challenges.css">
    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
</head>
<body>
    {{template "nav" .}}

    <div id="xp-popup" class="xp-popup hidden"></div>

    <main class="challenge-arena" data-mode="{{.Mode}}">
        <div class="arena-hud">
            <div class="arena-timer" id="arena-timer">
                <span class="timer-label">TIME</span>
                <span class="timer-value" id="timer-value">60</span>
            </div>
            <div class="arena-score" id="arena-score">
                <span class="score-label">SCORE</span>
                <span class="score-value" id="score-value">0</span>
            </div>
            <div class="arena-combo" id="arena-combo">
                <span class="combo-label">COMBO</span>
                <span class="combo-value" id="combo-value">x1</span>
            </div>
        </div>

        <div class="arena-content">
            <div class="arena-prompt" id="arena-prompt">
                <p>Click Start to begin!</p>
            </div>
            <div class="arena-editor" id="arena-editor"></div>
            <div class="arena-controls">
                <button id="btn-arena-start" class="btn-primary btn-large">Start Challenge</button>
                <button id="btn-arena-submit" class="btn-primary btn-large hidden">Submit</button>
            </div>
            <div class="arena-result" id="arena-result"></div>
        </div>

        <div class="arena-powerups" id="arena-powerups">
            <!-- Power-up slots rendered by JS -->
        </div>
    </main>

    <div class="inventory-bar" id="inventory-bar"></div>

    <script id="challenge-mode-data" type="application/json">{"mode": "{{.Mode}}"}</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/go/go.min.js"></script>
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
{{end}}
